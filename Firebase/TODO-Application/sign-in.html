<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <main>
        <div class="page-box">
            <div class="form-box">
                <h1>Sign In</h1>
                <div class="form-section">
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="signin_email" name="" tabindex="2" placeholder="Enter You Email">
                    </div>
                    <div class="form-field">
                        <label for="password">Password</label>
                        <input type="password" id="signin_password" name="" tabindex="2"
                            placeholder="Enter You Password">
                    </div>
                    <div class="action-btn-wrapper">
                        <!-- <button class="action-btn" id="signup_btn">Submit</button> -->
                        <button type="button" class="action-btn" id="signin_btn">Submit</button>
                    </div>
                </div>
                <p>Don't have an account? <a href="sign-up.html">Sign Up</a></p>
            </div>
        </div>
    </main>
    <script type="module" src="assets/js/sign-in-script.js" defer></script>
</body>

</html>
